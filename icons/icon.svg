<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="tile" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect class="tile" width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- 50/30/20 budget ring: needs, wants, savings -->
  <g transform="rotate(-90 256 268)" fill="none" stroke-width="48">
    <circle cx="256" cy="268" r="150" stroke="#ffffff" stroke-dasharray="457.2 485.3"/>
    <circle cx="256" cy="268" r="150" stroke="#ffffff" stroke-opacity="0.55" stroke-dasharray="268.7 673.8" stroke-dashoffset="-471.2"/>
    <circle cx="256" cy="268" r="150" stroke="#7cf5c4" stroke-dasharray="174.5 768" stroke-dashoffset="-754"/>
  </g>

  <!-- Dollar sign -->
  <text x="256" y="268" text-anchor="middle" dominant-baseline="central"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="190" font-weight="800"
        fill="#ffffff">$</text>

  <!-- AI sparkle -->
  <path d="M424 52 Q430 92 470 98 Q430 104 424 144 Q418 104 378 98 Q418 92 424 52 Z" fill="#ffd166"/>
  <path d="M468 146 Q471 162 486 165 Q471 168 468 184 Q465 168 450 165 Q465 162 468 146 Z" fill="#ffd166" fill-opacity="0.85"/>
</svg>
