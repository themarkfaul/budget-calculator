<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - My Budget AI</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#667eea">
</head>
<body>
    <div class="container" style="max-width: 480px;">
        <div class="app-header">My Budget AI</div>

        <div style="padding: 40px;">
            <div id="authMessage" class="auth-message" style="display:none;"></div>

            <div id="checkingLink" style="text-align:center; color:#6c757d;">Checking your reset link...</div>

            <!-- Shown once Supabase confirms the emailed link -->
            <div id="newPasswordForm" style="display:none;">
                <h2 style="text-align:center; margin-bottom:25px; color:#495057;">Choose a New Password</h2>
                <div class="input-field" style="margin-bottom:15px;">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Min 6 characters" autocomplete="new-password">
                </div>
                <div class="input-field" style="margin-bottom:25px;">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password">
                </div>
                <button class="btn btn-success" id="savePasswordBtn" style="width:100%; padding:15px; font-size:1em;" onclick="handleNewPassword()">Save New Password</button>
            </div>

            <!-- Expired, already used, or opened without a link -->
            <div id="badLink" style="display:none; text-align:center;">
                <h2 style="margin-bottom:15px; color:#495057;">Link Expired</h2>
                <p style="color:#6c757d; margin-bottom:25px;">This reset link is invalid or has expired. Reset links work once and only for a limited time.</p>
                <a class="btn btn-primary" href="/">Request a New Link</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/config.js"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        var linkHandled = false;

        function showMessage(text, isError) {
            var el = document.getElementById('authMessage');
            el.textContent = text;
            el.style.display = 'block';
            el.className = 'auth-message ' + (isError ? 'auth-error' : 'auth-success');
        }

        function showForm() {
            if (linkHandled) return;
            linkHandled = true;
            document.getElementById('checkingLink').style.display = 'none';
            document.getElementById('newPasswordForm').style.display = 'block';
        }

        function showBadLink() {
            if (linkHandled) return;
            linkHandled = true;
            document.getElementById('checkingLink').style.display = 'none';
            document.getElementById('badLink').style.display = 'block';
        }

        // Supabase reads the token from the link's URL and signs the user in for recovery
        supabase.auth.onAuthStateChange(function (event) {
            if (event === 'PASSWORD_RECOVERY') showForm();
        });

        (async function () {
            // Supabase puts errors (e.g. an expired link) in the URL instead of a session
            var params = new URLSearchParams(window.location.hash.slice(1) + '&' + window.location.search.slice(1));
            if (params.get('error') || params.get('error_code')) {
                showBadLink();
                return;
            }
            var result = await supabase.auth.getSession();
            if (result.data && result.data.session) showForm();
            else showBadLink();
        })();

        async function handleNewPassword() {
            var password = document.getElementById('newPassword').value;
            var confirm = document.getElementById('confirmPassword').value;
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters.', true);
                return;
            }
            if (password !== confirm) {
                showMessage('Passwords do not match.', true);
                return;
            }
            var btn = document.getElementById('savePasswordBtn');
            btn.disabled = true;
            btn.textContent = 'Saving...';
            try {
                await updatePassword(password);
                showMessage('Password updated. Taking you to your budgets...', false);
                setTimeout(function () { window.location.href = '/app.html'; }, 1500);
            } catch (err) {
                showMessage(err.message, true);
                btn.disabled = false;
                btn.textContent = 'Save New Password';
            }
        }

        document.getElementById('confirmPassword').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') handleNewPassword();
        });
    </script>
</body>
</html>
